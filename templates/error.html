{% extends "base.html" %}
{% block title %}Error | Office Task Manager{% endblock %}
{% block content %}
<section class="error-card">
  <div class="error-icon">!</div>
  <h1>Unable to complete the request</h1>
  <p>{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('dashboard') if session.get('user_email') else url_for('login') }}">Go back</a>
</section>
{% endblock %}
